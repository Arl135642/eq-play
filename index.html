<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Эмо-Блиц: узнай эмоцию по лицу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap&subset=cyrillic">
<style>
:root{--bg:#07060f;--tx:#eaf2ff;--mu:#8c93b8;--c:#4dffd2;--pk:#ff3df2;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,"Segoe UI",sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 420px at 50% 15%,color-mix(in srgb,var(--c) 20%,transparent),transparent),linear-gradient(transparent 95%,rgba(77,255,210,.1) 95%) 0 0/100% 40px,linear-gradient(90deg,transparent 95%,rgba(255,61,242,.09) 95%) 0 0/40px 100%;transition:background .4s}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px;text-align:center}
.logo{font:800 38px/1.05 Unbounded,sans-serif;background:linear-gradient(90deg,var(--c),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent;margin:18px 0 12px;filter:drop-shadow(0 0 14px rgba(255,61,242,.4))}
.mu{color:var(--mu)}
.hud{display:flex;justify-content:space-between;align-items:center;font:500 12px Unbounded,sans-serif;letter-spacing:.04em}
.hud b{display:block;font-size:20px;color:var(--c);text-shadow:0 0 12px var(--c)}
.hearts{display:flex;gap:4px}
.h svg{width:22px;height:22px;fill:#ff3d7a;filter:drop-shadow(0 0 6px #ff3d7a)}
.h.d svg{fill:none;stroke:#ff3d7a66;stroke-width:2;filter:none}
.tb{height:6px;background:#ffffff14;border-radius:9px;margin:14px 0;overflow:hidden}
.tb i{display:block;height:100%;width:100%;background:var(--c);box-shadow:0 0 14px var(--c)}
.face{width:min(60vw,230px);margin:8px auto;color:var(--c);filter:drop-shadow(0 0 20px var(--c));animation:pop .35s ease both}
.face svg{width:100%;display:block;fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.face .f{fill:currentColor;stroke:none}
.face .a{fill:currentColor;fill-opacity:.25}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cue{min-height:54px;margin:10px 0;color:var(--mu);font-size:15px}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{font:500 14px Unbounded,sans-serif;color:var(--tx);background:#ffffff0a;border:1.5px solid #ffffff2a;border-radius:14px;padding:18px 8px;cursor:pointer;transition:.15s}
.ch:hover:not(:disabled){border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 40%,transparent);transform:translateY(-2px)}
.ch:disabled{cursor:default}
.ch.ok{border-color:#4dff88;color:#4dff88;box-shadow:0 0 20px #4dff8866;background:#4dff8814}
.ch.no{border-color:#ff4d6a;color:#ff4d6a;background:#ff4d6a14;animation:sh .3s}
.go{font:800 16px Unbounded,sans-serif;background:linear-gradient(90deg,#4dffd2,#ff3df2);color:#07060f;border:0;padding:16px 38px;border-radius:99px;box-shadow:0 0 30px #4dffd288;cursor:pointer;margin-top:20px}
.go:hover{transform:scale(1.04)}
.big{font:800 72px/1 Unbounded,sans-serif;color:var(--c);text-shadow:0 0 28px var(--c);margin:18px 0 6px}
.rank{font:800 18px Unbounded,sans-serif;color:var(--pk);text-shadow:0 0 14px var(--pk)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{--bg:#0b0d12;--tx:#e8ecf5;--mu:#7f8aa3;--c:#c7d0e0!important}
body{font-family:Inter,system-ui,"Segoe UI",sans-serif}
body::before{background:radial-gradient(900px 500px at 50% -10%,#1b2236,transparent)!important}
main{text-align:left}
.logo{font:700 26px/1.2 "JetBrains Mono",monospace;background:none;color:var(--tx);filter:none;margin:20px 0 10px;letter-spacing:-.02em}
.hud{font:400 11px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
.hud b{font:700 22px "JetBrains Mono",monospace;color:var(--tx);text-shadow:none;letter-spacing:0}
.h svg{fill:#c7d0e0;filter:none}.h.d svg{fill:none;stroke:#c7d0e055}
.tb{height:3px;border-radius:0}.tb i{background:#c7d0e0;box-shadow:none}
.face{filter:none;margin:16px auto}
.face svg{stroke-width:2.6}
.cue{font-size:14px}
.chs{counter-reset:k}
.ch{counter-increment:k;font:400 14px "JetBrains Mono",monospace;text-align:left;border-radius:4px;background:#ffffff06;border:1px solid #ffffff1f;padding:15px 14px}
.ch::before{content:counter(k);color:var(--mu);margin-right:12px}
.ch:hover:not(:disabled){box-shadow:none;transform:none;border-color:#c7d0e0;background:#ffffff0c}
.ch.ok{box-shadow:none;border-color:#6fcf97;color:#6fcf97}
.ch.no{box-shadow:none;border-color:#eb6b6b;color:#eb6b6b}
.go{font:700 13px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;background:#e8ecf5;color:#0b0d12;border-radius:4px;box-shadow:none;padding:14px 28px}
.go:hover{transform:none;background:#fff}
.big{font:700 64px "JetBrains Mono",monospace;color:var(--tx);text-shadow:none}
.rank{font:700 13px "JetBrains Mono",monospace;color:#c7d0e0;text-shadow:none;letter-spacing:.1em;text-transform:uppercase}
.sig{font:400 17px/1.55 "JetBrains Mono",monospace;border:1px solid #ffffff1f;border-radius:4px;padding:30px 18px;margin:16px 0;text-align:left;background:#ffffff06}
</style>
</head>
<body>
<main id="app"></main>
<script>
const D='<circle class="f" cx="44" cy="52" r="5"/><circle class="f" cx="76" cy="52" r="5"/>';
const E={
joy:["Радость","#ffe14d","щёки приподняты, глаза прищурены, уголки губ вверх.",'<path d="M36 54q8-10 16 0M68 54q8-10 16 0M36 40q8-6 16-2M68 38q8-4 16 2"/><path class="a" d="M38 72q22 26 44 0z"/>'],
sad:["Грусть","#4da6ff","внутренние края бровей приподняты, уголки губ опущены.",D+'<path d="M34 44L52 36M86 44L68 36M42 86q18-16 36 0"/><path class="f" d="M44 64q5 8 0 11q-5-3 0-11z"/>'],
anger:["Злость","#ff4d6a","брови сведены и опущены, губы плотно сжаты.",D+'<path d="M32 36L52 46M88 36L68 46M42 82h36M48 82v7M60 82v7M72 82v7"/>'],
surprise:["Удивление","#4dffd2","брови высоко, глаза широкие, рот округлён.",'<circle cx="44" cy="54" r="8"/><circle cx="76" cy="54" r="8"/><circle class="f" cx="44" cy="54" r="2.5"/><circle class="f" cx="76" cy="54" r="2.5"/><path d="M34 34q10-8 18 0M68 34q10-8 18 0"/><ellipse cx="60" cy="86" rx="7" ry="10"/>'],
fear:["Страх","#b388ff","брови приподняты и сдвинуты, глаза раскрыты, губы напряжены.",'<circle cx="44" cy="52" r="8"/><circle cx="76" cy="52" r="8"/><circle class="f" cx="44" cy="52" r="2.5"/><circle class="f" cx="76" cy="52" r="2.5"/><path d="M34 38L52 30M86 38L68 30"/><ellipse cx="60" cy="86" rx="9" ry="6"/><path class="f" d="M97 40q5 8 0 11q-5-3 0-11z"/>'],
disgust:["Отвращение","#8bff4d","нос морщится, верхняя губа приподнята.",'<path d="M34 40L52 44M86 36L68 44M36 54h16M68 54h16M40 80q6-6 10 0q6 6 10 0q6-6 10 0M54 82v8q6 5 12 0v-8"/>'],
contempt:["Презрение","#ff9f4d","уголок рта поднят только с одной стороны.",'<path d="M34 36q10-6 18 0M68 42h18M38 52h12M70 52h12M44 82q18 4 32-8"/>'],
shame:["Стыд","#ff7ad9","взгляд опущен, щёки краснеют, губы поджаты.",'<path d="M36 56q8 6 16 0M68 56q8 6 16 0M48 84q12-4 24 0M36 44L52 42M84 44L68 42"/><circle class="f" cx="36" cy="70" r="6" opacity=".35"/><circle class="f" cx="84" cy="70" r="6" opacity=".35"/>']};
const K=Object.keys(E),$=id=>document.getElementById(id),app=$("app"),root=document.documentElement;
const HR='<svg viewBox="0 0 24 24"><path d="M12 21S3 15 3 9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-9 12-9 12z"/></svg>';
const face=k=>`<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54"/>${E[k][3]}</svg>`;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let s,cur,last,left,T,tmr,lock,best=0;
try{best=+localStorage.getItem("eb")||0}catch(e){}
const hud=()=>`<div><span class="mu">СЧЁТ</span><b>${s.sc}</b></div><div class="hearts">${[0,1,2].map(i=>`<i class="h${i<s.lv?"":" d"}">${HR}</i>`).join("")}</div><div><span class="mu">СЕРИЯ</span><b>×${s.st}</b></div>`;
function start(){root.style.setProperty("--c","#4dffd2");
 app.innerHTML=`<div class="logo">Эмо-Блиц<br><span class="mu">тренажёр распознавания эмоций</span></div><p class="mu">Для тех, кто хочет точнее считывать людей на переговорах, в команде и в семье. Определяйте эмоцию по мимике, пока не вышло время. Три попытки, серии дают бонус, с каждым уровнем выражения становятся тоньше.</p><div class="face">${face("surprise")}</div><button class="go" onclick="play()">Начать сессию</button><p class="mu">Рекорд: ${best} · клавиши 1–4</p>`}
function play(){s={sc:0,lv:3,st:0,n:0,ok:0};next()}
function next(){lock=false;const pool=K.slice(0,s.n<4?5:s.n<9?7:8);
 do{cur=pool[Math.random()*pool.length|0]}while(cur==last);last=cur;
 const C={joy:"surprise",sad:"shame",anger:"disgust",surprise:"fear",fear:"surprise",disgust:"contempt",contempt:"disgust",shame:"sad"},rest=sh(pool.filter(x=>x!=cur&&x!=C[cur])),o=sh([cur,...(pool.includes(C[cur])?[C[cur]]:[]),...rest].slice(0,4));
 T=left=Math.max(2.5,6-s.n*.15);root.style.setProperty("--c",E[cur][1]);
 app.innerHTML=`<div class="hud" id="hud">${hud()}</div><div class="tb"><i id="tb"></i></div>${s.n%4==3?`<div class="sig">Признаки: ${E[cur][2]}</div>`:`<div class="face">${face(cur)}</div>`}<div class="cue" id="cue">Какая это эмоция?</div><div class="chs">${o.map(k=>`<button class="ch" data-k="${k}" onclick="ans('${k}')">${E[k][0]}</button>`).join("")}</div>`;
 clearInterval(tmr);tmr=setInterval(()=>{left-=.05;$("tb").style.width=Math.max(left,0)/T*100+"%";if(left<=0)ans(null)},50)}
function ans(k){if(lock)return;lock=true;clearInterval(tmr);s.n++;const ok=k==cur;
 if(ok){s.sc+=10+Math.min(s.st,5)*3+Math.ceil(left);s.st++;s.ok++}else{s.lv--;s.st=0}
 document.querySelectorAll(".ch").forEach(b=>{b.disabled=true;if(b.dataset.k==cur)b.classList.add("ok");else if(b.dataset.k==k)b.classList.add("no")});
 $("cue").innerHTML=(k===null?"Время вышло. ":"")+`<b style="color:${E[cur][1]}">${E[cur][0]}</b>: ${E[cur][2]}`;
 $("hud").innerHTML=hud();
 setTimeout(()=>s.lv>0?next():end(),ok?1500:2300)}
function end(){if(s.sc>best){best=s.sc;try{localStorage.setItem("eb",best)}catch(e){}}
 const r=s.sc<60?"Базовый":s.sc<150?"Уверенный":s.sc<300?"Продвинутый":"Экспертный";
 root.style.setProperty("--c","#ff3df2");
 app.innerHTML=`<div class="logo" style="font-size:24px">Итоги сессии</div><div class="big">${s.sc}</div><div class="rank">Уровень: ${r}</div><p class="mu">Точность: ${s.n?Math.round(s.ok/s.n*100):0}% · раундов: ${s.n}<br>Рекорд: ${best}</p><button class="go" onclick="play()">Повторить</button>`}
addEventListener("keydown",e=>{const b=document.querySelectorAll(".ch")[+e.key-1];if(b&&!b.disabled)b.click()});
start();
</script>
</body>
</html>
